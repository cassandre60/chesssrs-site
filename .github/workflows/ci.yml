name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run unit tests
        run: npm test

      # scripts/sync-design.js and scripts/sync-strings.js read the Flutter app repo, which is not a
      # submodule, so this only runs where a sibling checkout exists. The other half of the drift
      # gate — design/app-ui.json vs the running demo — is tests/e2e/app-parity.spec.js below, and
      # it runs everywhere, because the manifest is committed.
      - name: Check generated files against the app repo (skipped when absent)
        run: |
          APP_DIR="${CHESSSRS_APP_DIR:-$HOME/Chess Repertoire SRS}"
          if [ -d "$APP_DIR" ]; then
            CHESSSRS_APP_DIR="$APP_DIR" npm run sync:check
          else
            echo "::notice::App repo not found at $APP_DIR — skipping sync:check. Set CHESSSRS_APP_DIR to enable it."
          fi

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E, App-Parity & Accessibility Tests
        run: npm run test:e2e

      - name: Build site
        run: python3 build.py
