name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run unit tests
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E & Accessibility Tests
        run: npm run test:e2e

      - name: Build site
        run: python3 build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The Pages artifact is `path: '.'`, because the site is served from the repository root
      # (index.html pulls in main.js, chess.bundle.js, engine.js, pieces.js and assets/ by relative
      # path). Enumerating those instead would silently drop any root file added later, so the
      # directory is uploaded whole and the build-only trees are removed first: npm ci put 23MB of
      # node_modules here, and the Playwright runs add test-results. Nothing in the demo ever loads
      # either, but both were being published as part of the site.
      - name: Drop build-only directories
        run: rm -rf node_modules test-results playwright-report

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
